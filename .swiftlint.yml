included:
  - Navigation
  - StorageService
  - NavigationTests

excluded:
  - Navigation/Resources

disabled_rules:
  - trailing_whitespace

opt_in_rules:
  - empty_count
  - closure_spacing
  - explicit_init
  - first_where
  - redundant_nil_coalescing
  - force_unwrapping

line_length:
  warning: 140
  error: 200

type_body_length:
  warning: 350
  error: 450

file_length:
  warning: 450
  error: 600

identifier_name:
  min_length: 2
